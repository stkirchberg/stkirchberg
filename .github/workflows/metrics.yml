name: Metrics
on:
  # Automatisch jeden Tag um Mitternacht aktualisieren
  schedule:
    - cron: "0 0 * * *"
  # Erlaubt es dir, die Action manuell unter dem Reiter "Actions" zu starten
  workflow_dispatch:
  # Aktualisiert die Stats, wenn du etwas in den Main-Branch pushst
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: stkirchberg
          template: classic
          base: header, community, repositories, metadata
          config_timezone: Europe/Berlin
